<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copa Kaleo - Transmissão Ao Vivo</title>

    <link rel="icon" type="image/jpg" href="img/Kaleo.jpg">

    <script src="https://cdn.tailwindcss.com"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyA5EigXpyiczdV4k6BSNSxrxtxyYT_FjaA",
            authDomain: "copakaleo.firebaseapp.com",
            databaseURL: "https://copakaleo-default-rtdb.firebaseio.com",
            projectId: "copakaleo",
            storageBucket: "copakaleo.firebasestorage.app",
            messagingSenderId: "966505093433",
            appId: "1:966505093433:web:c15a187aca147de887f0e8",
            measurementId: "G-HSF7T692Z7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const videoRef = ref(db, 'transmissao/videoAtual');

        // Escuta mudanças no banco para atualizar o vídeo em tempo real
        onValue(videoRef, (snapshot) => {
            let dbValue = snapshot.val();
            console.log("Firebase retornou o valor:", dbValue); 
            
            if (dbValue) {
                dbValue = dbValue.trim();

                // Separa o ID do vídeo dos parâmetros de tempo (se existirem)
                const baseId = dbValue.split('?')[0];

                // Verifica se a base é um ID válido do YouTube (sempre 11 caracteres)
                if (baseId && baseId.length === 11) {
                    const iframe = document.getElementById('yt-iframe');
                    
                    // Adiciona autoplay e mute corretamente dependendo se já existem outros parâmetros
                    const separator = dbValue.includes('?') ? '&' : '?';
                    const newSrc = `https://www.youtube-nocookie.com/embed/${dbValue}${separator}autoplay=1&mute=1`;
                    
                    // Só atualiza o iframe se a fonte for diferente da atual
                    if (iframe && iframe.src !== newSrc) {
                        console.log("A atualizar iframe para:", newSrc);
                        iframe.src = newSrc;
                    }
                } else {
                    console.error("O valor na base de dados não é um ID válido do YouTube:", dbValue);
                }
            }
        });

        // Função Global para o Admin atualizar o Firebase
        window.updateVideo = function () {
            const url = document.getElementById('yt-link').value.trim();
            console.log("Admin enviou o link:", url);
            const videoData = extractVideoID(url);

            if (videoData) {
                set(videoRef, videoData)
                    .then(() => {
                        document.getElementById('error-msg').classList.add('hidden');
                        document.getElementById('yt-link').value = '';
                        showMsgModal("Transmissão atualizada com sucesso na base de dados!");
                    })
                    .catch((error) => {
                        console.error("Erro Firebase:", error);
                        alert("Erro ao guardar. Verifique as regras de permissão da base de dados.");
                    });
            } else {
                document.getElementById('error-msg').classList.remove('hidden');
            }
        };

        // Função super robusta para extrair o ID e o Tempo Inicial (se houver) de qualquer formato
        function extractVideoID(url) {
            if (!url) return null;
            let id = null;
            let timeParam = "";

            try {
                // Tenta extrair o parâmetro de tempo (?t= ou &t=)
                let urlObj;
                if (!url.startsWith('http')) {
                    urlObj = new URL('https://' + url);
                } else {
                    urlObj = new URL(url);
                }

                if (urlObj.searchParams.has('t')) {
                    timeParam = "?start=" + parseInt(urlObj.searchParams.get('t'));
                } else if (urlObj.searchParams.has('start')) {
                    timeParam = "?start=" + parseInt(urlObj.searchParams.get('start'));
                }
            } catch (e) {
                console.warn("Sem parâmetros de tempo adicionais detetados.");
            }

            // Regex padrão para extrair apenas o ID de 11 caracteres do vídeo
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|live\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            id = (match && match[2].length === 11) ? match[2] : null;

            if (id) {
                return id + timeParam; // Guarda na base de dados o ID e o tempo (Ex: y8e9RoHuEHY?start=31814)
            }
            return null;
        }
    </script>

    <style>
        .fade-edges {
            -webkit-mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
            mask-image: linear-gradient(to bottom, transparent 0%, black 10%, black 90%, transparent 100%);
        }

        .sponsor-track {
            display: flex;
            flex-direction: column;
            animation: scrollVertical 140s linear infinite;
        }

        .sponsor-track:hover { animation-play-state: paused; }

        @keyframes scrollVertical {
            0% { transform: translateY(0); }
            100% { transform: translateY(-50%); }
        }
    </style>
</head>

<body class="bg-gray-950 text-white min-h-screen flex flex-col">

    <header class="bg-gray-900 border-b border-gray-800 py-6 px-4 shadow-[0_4px_30px_rgba(0,0,0,0.5)] z-10 relative">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="https://copafacil.com/4copakaleo" target="_blank" rel="noopener noreferrer"
               class="flex flex-col items-center gap-1 group">
                <span class="bg-green-500 hover:bg-green-400 text-white text-xs font-bold px-3 py-2 rounded-xl shadow-lg shadow-green-500/30 transition-all duration-300 group-hover:scale-105 flex items-center gap-2 whitespace-nowrap">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"/>
                    </svg>
                    Copa Fácil
                </span>
                <span class="text-green-400 text-[10px] leading-tight text-center hidden md:block">Acompanhe os resultados<br>em tempo real</span>
            </a>

            <div class="flex items-center gap-4 hover:scale-105 transition-transform duration-300">
                <div class="bg-gradient-to-br from-blue-600 to-purple-600 p-1 rounded-xl shadow-lg shadow-blue-500/20">
                    <img src="img/Kaleo.jpg" alt="Copa Kaleo" class="w-10 h-10 md:w-12 md:h-12 object-cover rounded-lg"
                        onerror="this.onerror=null;this.src='https://placehold.co/150x150/1f2937/4ade80?text=COPA';">
                </div>

                <h1 class="text-4xl md:text-5xl font-black uppercase tracking-tighter text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-purple-400 to-pink-400 drop-shadow-sm">
                    Copa Kaleo
                </h1>
            </div>

            <button onclick="openAdminModal()" class="w-10 h-10 md:w-12 md:h-12 flex items-center justify-center rounded-full hover:bg-gray-800 text-gray-500 hover:text-white transition-colors">
                <svg class="w-5 h-5 md:w-6 md:h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="flex-1 w-full max-w-[1500px] mx-auto p-4 md:p-6 lg:p-8 flex flex-col lg:flex-row gap-6">

        <section class="flex-1 flex flex-col gap-5">
            <div class="relative w-full pt-[56.25%] bg-black rounded-2xl overflow-hidden shadow-2xl border border-gray-800 ring-1 ring-white/10 group">
                <!-- O atributo SRC foi removido. O vídeo agora só carrega através da base de dados Firebase -->
                <iframe id="yt-iframe" class="absolute top-0 left-0 w-full h-full"
                    title="Transmissão Copa Kaleo" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen>
                </iframe>
            </div>

            <div id="admin-controls" class="hidden bg-gray-900/80 backdrop-blur p-4 rounded-xl border border-blue-500/50 shadow-lg flex flex-col sm:flex-row gap-4 items-center">
                <div class="flex-1 w-full">
                    <label class="block text-xs font-bold text-blue-400 uppercase mb-1.5">Painel Admin: Link YouTube</label>
                    <input type="text" id="yt-link" placeholder="Cole o link aqui..." class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-2.5 text-sm text-gray-200 focus:border-blue-500 outline-none">
                    <p id="error-msg" class="text-red-400 text-xs mt-1.5 hidden">Link inválido.</p>
                </div>
                <button onclick="updateVideo()" class="bg-blue-600 hover:bg-blue-500 px-6 py-2.5 rounded-lg text-sm font-bold transition-all transform hover:scale-105">Atualizar Tela</button>
            </div>
        </section>

        <aside class="w-full lg:w-[420px] bg-gray-900 rounded-2xl border border-gray-800 flex flex-col overflow-hidden h-[450px] lg:h-auto">
            <div class="p-5 border-b border-gray-800 flex items-center justify-center gap-2">
                <span class="text-yellow-500">★</span>
                <h2 class="text-sm font-bold text-gray-300 uppercase tracking-widest">Patrocinadores</h2>
            </div>
            <div class="flex-1 relative bg-gray-950/50 fade-edges overflow-hidden">
                <div class="sponsor-track absolute w-full top-0" id="sponsor-track"></div>
            </div>
        </aside>
    </main>

    <!-- Modal Admin -->
    <div id="admin-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-800 p-8 rounded-2xl shadow-2xl w-full max-w-sm transform scale-95 transition-transform duration-300" id="admin-modal-content">
            <h3 class="text-xl font-bold text-white mb-6 text-center">Acesso Admin</h3>
            <input type="password" id="admin-password" placeholder="Senha" class="w-full bg-gray-950 border border-gray-700 rounded-lg px-4 py-3 text-white mb-2 outline-none focus:border-blue-500">
            <p id="login-error" class="text-red-400 text-xs mb-4 hidden text-center">Senha incorreta.</p>
            <div class="flex gap-3 mt-4">
                <button onclick="closeAdminModal()" class="flex-1 bg-gray-800 py-2.5 rounded-lg">Cancelar</button>
                <button onclick="verifyAdmin()" class="flex-1 bg-blue-600 py-2.5 rounded-lg">Entrar</button>
            </div>
        </div>
    </div>

    <!-- Modal de Mensagem -->
    <div id="msg-modal" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex-col items-center justify-center opacity-0 transition-opacity duration-300">
        <div class="bg-gray-900 border border-gray-800 p-6 rounded-2xl text-center">
            <p id="msg-text" class="text-white mb-6 mt-2 font-medium"></p>
            <button onclick="closeMsgModal()" class="bg-blue-600 px-8 py-2.5 rounded-lg w-full font-bold">OK</button>
        </div>
    </div>

    <script>
        const ADMIN_PASSWORD = "CopaKaleo2026";

        function openAdminModal() {
            const m = document.getElementById('admin-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
            setTimeout(() => { 
                m.classList.remove('opacity-0'); 
                document.getElementById('admin-modal-content').classList.remove('scale-95'); 
            }, 10);
        }

        function closeAdminModal() {
            const m = document.getElementById('admin-modal');
            m.classList.add('opacity-0');
            document.getElementById('admin-modal-content').classList.add('scale-95');
            setTimeout(() => {
                m.classList.add('hidden');
                m.classList.remove('flex');
                document.getElementById('admin-password').value = '';
                document.getElementById('login-error').classList.add('hidden');
            }, 300);
        }

        function verifyAdmin() {
            if (document.getElementById('admin-password').value === ADMIN_PASSWORD) {
                closeAdminModal();
                const controls = document.getElementById('admin-controls');
                controls.classList.remove('hidden');
                controls.classList.add('flex');
            } else {
                document.getElementById('login-error').classList.remove('hidden');
            }
        }

        function showMsgModal(t) {
            document.getElementById('msg-text').innerText = t;
            const m = document.getElementById('msg-modal');
            m.classList.remove('hidden');
            m.classList.add('flex');
            setTimeout(() => m.classList.remove('opacity-0'), 10);
        }

        function closeMsgModal() {
            const m = document.getElementById('msg-modal');
            m.classList.add('opacity-0');
            setTimeout(() => {
                m.classList.add('hidden');
                m.classList.remove('flex');
            }, 300);
        }

        // PATROCINADORES - Rolagem Infinita Perfeita
        const sponsors = [
            { name: "Patrocinador 43", logo: "img/43.png" },
            { name: "Patrocinador 44", logo: "img/44.png" },
            { name: "Patrocinador 45", logo: "img/45.png" },
            { name: "Patrocinador 46", logo: "img/46.png" },
            { name: "Patrocinador 47", logo: "img/47.png" },
            { name: "Patrocinador 48", logo: "img/48.png" },
            { name: "Patrocinador 49", logo: "img/49.png" },
            { name: "Patrocinador 50", logo: "img/50.png" },
            { name: "Patrocinador 51", logo: "img/51.png" }
        ];

        const track = document.getElementById('sponsor-track');
        
        // 1. Criamos o HTML base de um patrocinador
        const itemHTML = sponsors.map(s => `
            <div class="flex justify-center items-center px-6 py-1">
                <img src="${s.logo}" alt="${s.name}" class="w-full h-auto rounded-xl border border-gray-700 bg-gray-800 p-2 transition-transform hover:scale-110">
            </div>
        `).join('');
        
        // 2. Multiplicamos a lista para garantir que preenche sempre a tela inteira (evita buracos se houver poucas logos)
        const blockHTML = itemHTML.repeat(6); 

        // 3. Criamos um bloco que tem o gap (espaço) interno de 8, e um padding bottom de 8 para unir perfeitamente ao próximo bloco
        const fullBlock = `<div class="flex flex-col gap-8 pb-8">${blockHTML}</div>`;

        // 4. Inserimos exatamente 2 blocos iguais. O CSS translateY(-50%) fará a transição invisível do fim do bloco 1 para o início do bloco 2!
        track.innerHTML = fullBlock + fullBlock;
    </script>
</body>
</html>
