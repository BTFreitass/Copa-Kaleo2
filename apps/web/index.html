<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#030712" />
    <meta name="description" content="Copa Kaleo: notícias, transmissão ao vivo, bolão, figurinhas e estatísticas do torneio." />
    <meta property="og:title" content="Copa Kaleo" />
    <meta property="og:image" content="/img/Kaleo.jpg" />
    <link rel="icon" type="image/jpeg" href="/img/Kaleo.jpg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Copa Kaleo</title>
    <script>
      (function () {
        var saved = null;
        try { saved = localStorage.getItem('copa:theme'); } catch (e) {}
        var theme = saved === 'light' || saved === 'dark' ? saved : window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
        var palette = null;
        try { palette = localStorage.getItem('copa:palette'); } catch (e) {}
        if (palette !== 'quadra' && palette !== 'classico') palette = 'quadra';
        var colors = { quadra: { light: '#f6f7f9', dark: '#0e1013' }, classico: { light: '#f3f6fb', dark: '#070d1c' } };
        document.documentElement.classList.add(theme);
        document.documentElement.setAttribute('data-palette', palette);
        document.querySelector('meta[name="theme-color"]').setAttribute('content', colors[palette][theme]);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
